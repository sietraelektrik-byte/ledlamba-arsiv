name: Update Product Feed and Deploy

on:
  schedule:
    - cron: '0 3 * * *' # Her gece Türkiye saatiyle sabaha karşı otomatik çalışır
  workflow_dispatch: # Manuel tetikleme butonunu aktif eder

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install fs-extra axios xml2js

      - name: Run Parser Script
        run: node parser.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Sadece docs klasörünü zorla ekle, diğer çer çöpü görmezden gel
          git add -f docs/
          
          # Eğer docs klasöründe bir değişiklik varsa commit et ve gönder
          if [ -n "$(git status --porcelain docs/)" ]; then
            git commit -m "🤖 Otomatik Ürün Listesi Güncellendi [Skip GitHub Actions]"
            git push origin main
          else
            echo "Herhangi bir ürün güncellemesi bulunamadı, repo temiz."
          fi
